name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + test + reports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dwarpal_test
          POSTGRES_USER: dwarpal
          POSTGRES_PASSWORD: dwarpal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      LOG_LEVEL: WARNING
      SECRET_KEY: "test-secret-key-for-ci-only-thirty-two-plus-chars-long"
      PUBLIC_BASE_URL: http://localhost:8000
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: dwarpal_test
      DB_USER: dwarpal
      DB_PASSWORD: dwarpal
      # Placeholders only. No test may require a real credential.
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-secret
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
      GEMINI_API_KEY: ci-gemini-key
      META_ACCESS_TOKEN: ci-meta-token
      META_PHONE_NUMBER_ID: "0000000000"
      META_VERIFY_TOKEN: ci-verify-token
      META_APP_SECRET: ci-app-secret
      MERCHANT_API_TOKEN: ci-merchant-token
      MERCHANT_KEY_ID: dwarpal-merchant-ci
      MERCHANT_SIGNING_KEY_DIR: ./secrets/merchant_keys
      TRUST_REGISTRY_PATH: ./config/trust_registry.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.6 pytest==8.3.4

      - name: Lint
        run: ruff check app tests

      - name: Lint the standalone tooling
        run: ruff check tools interop

      - name: Run tests
        run: pytest -q

      - name: Generate the attack scorecard and dispute defence reports
        run: python -m app.cli reports

      # The reports step commits its packets to a separate database, so the export names it.
      # --min-packets makes an empty chain a failure: verifying nothing is not a pass.
      # The reports step commits its packets to a separate database, so the export names it.
      # --min-packets makes an empty chain a failure: verifying nothing is not a pass.
      - name: Verify the evidence chain with the application stopped
        run: |
          python -m app.cli --database "${DB_NAME}_reports" \
            export-evidence --out reports/evidence.jsonl
          python -m app.cli export-jwks --out reports/merchant_jwks.json
          python tools/verify_evidence.py \
            --jsonl reports/evidence.jsonl \
            --jwks reports/merchant_jwks.json \
            --min-packets 40
            --min-packets 40

      - name: Upload conformance and scorecard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwarpal-reports
          path: backend/reports/
          if-no-files-found: ignore

  interop:
    name: AP2 interop (live merchant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dwarpal
          POSTGRES_USER: dwarpal
          POSTGRES_PASSWORD: dwarpal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      LOG_LEVEL: WARNING
      SECRET_KEY: "interop-secret-key-for-ci-only-thirty-two-plus-chars"
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: dwarpal
      DB_USER: dwarpal
      DB_PASSWORD: dwarpal
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci-secret
      RAZORPAY_WEBHOOK_SECRET: ci-webhook-secret
      GEMINI_API_KEY: ci-gemini-key
      META_VERIFY_TOKEN: ci-verify-token
      META_APP_SECRET: ci-app-secret
      MERCHANT_API_TOKEN: ci-merchant-token
      MERCHANT_KEY_ID: dwarpal-merchant-ci
      MERCHANT_SIGNING_KEY_DIR: ./secrets/merchant_keys
      TRUST_REGISTRY_PATH: ./config/trust_registry.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the merchant
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/dwarpal.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Drive the AP2 scenarios against it
        run: python interop/run_interop.py --base http://127.0.0.1:8000

      - name: Merchant log
        if: failure()
        run: cat /tmp/dwarpal.log

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_ORIGIN: http://localhost:8000

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: dwarpal-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: dwarpal-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
