family: legitimate-traffic
description: >
  Matched legitimate agent traffic that must be allowed through. A gate that blocks everything
  scores perfectly against the adversarial corpus and is useless, so these run alongside it and
  the false-positive rate is reported with the block rate, always.

scenarios:
  - id: single-item-within-authority
    description: One authorised item, comfortably inside every constraint the human set.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    expect_blocked: false

  - id: multiple-units-of-one-item
    description: Several units of the same item, inside the item's maximum order quantity.
    cart:
      - sku: DWP-NTB-011
        title: Hardcover Notebook A5
        quantity: 5
    expect_blocked: false

  - id: multi-line-cart
    description: A cart with several distinct authorised items.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 2
      - sku: DWP-COF-002
        title: Single Origin Coffee Beans 500g
        quantity: 1
      - sku: DWP-NTB-011
        title: Hardcover Notebook A5
        quantity: 3
    expect_blocked: false

  - id: high-value-within-cap
    description: An expensive item that is still inside the cap the human set.
    cart:
      - sku: DWP-HDP-007
        title: Wireless Headphones
        quantity: 1
    mandate:
      amount_cap_minor: 2000000
    expect_blocked: false

  - id: exactly-at-the-cap
    description: >
      A purchase whose total equals the cap exactly. An off-by-one in the comparison would refuse
      a purchase the human authorised.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    mandate:
      amount_cap_minor: 45000
    expect_blocked: false

  - id: natural-language-constraint-not-violated
    description: >
      The human said nothing perishable and the cart contains a notebook. The kernel cannot decide
      this, and the merchant asks the human rather than guessing. That is a refusal to complete
      autonomously, not a false positive, so this scenario expects the escalation.
    cart:
      - sku: DWP-NTB-011
        title: Hardcover Notebook A5
        quantity: 1
    mandate:
      natural_language:
        - nothing perishable
    expect_blocked: true
    expect_reason_codes:
      - ESCALATION_REQUIRED
      - ESCALATION_TIMEOUT

  - id: regulated-tier-buys-a-restricted-item
    description: >
      An age-restricted item bought under a credential from a regulated issuing authority, whose
      tier does permit it. This must succeed, otherwise the tier system does nothing useful.
    cart:
      - sku: DWP-WIN-005
        title: Sula Cabernet Shiraz 750ml
        quantity: 1
    mandate:
      issuer_id: did:web:bank.dwarpal.test
    setup:
      # The wine may not be sold into four states, so a legitimate buyer says where it is.
      buyer_region: KA
    expect_blocked: false

  - id: budget-partially-consumed
    description: A purchase that fits inside a budget constraint with room to spare.
    cart:
      - sku: DWP-COF-002
        title: Single Origin Coffee Beans 500g
        quantity: 1
    mandate:
      budget_minor: 500000
    expect_blocked: false

  - id: execution-window-open
    description: An execution window that is currently open must not block the purchase.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    mandate:
      execution_not_before: "2020-01-01T00:00:00+00:00"
      execution_not_after: "2099-01-01T00:00:00+00:00"
    expect_blocked: false

  - id: recurrence-within-allowance
    description: A mandate that permits several uses, exercised once.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    mandate:
      max_occurrences: 5
    expect_blocked: false

  - id: last-unit-in-stock
    description: Buying the final unit of an item must succeed for the agent that wins it.
    cart:
      - sku: DWP-PEN-012
        title: Fountain Pen Medium Nib
        quantity: 1
    expect_blocked: false

  - id: substitute-item-purchase
    description: A lower-priced substitute in the same category as a contended item.
    cart:
      - sku: DWP-LMP-010
        title: Desk Lamp Compact
        quantity: 1
    expect_blocked: false
