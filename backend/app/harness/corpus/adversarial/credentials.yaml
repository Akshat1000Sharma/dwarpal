family: credential-integrity
description: >
  Attacks on the credential chain itself: forged signatures, algorithm confusion, disclosure
  tampering, replay, presentation by an agent the credential was not issued to, key-binding proofs
  addressed elsewhere, validity windows, and untrusted issuing authorities.

  Every technique here refuses inside the verification pipeline, before the policy kernel runs at
  all. That is why each one is executed against several carts and every issuing tier: the item and
  the tier cannot change the answer, so a case that answered differently would be a real finding.

# Anchors. The loader reads family, description and scenarios; anything else here is YAML reuse.
carts: &carts
  - [{sku: DWP-TEA-001, title: Nilgiri Black Tea 250g, quantity: 1}]
  - [{sku: DWP-NTB-011, title: Hardcover Notebook A5, quantity: 2}]
  - [{sku: DWP-MLK-003, title: Fresh Paneer 400g, quantity: 3}]
  - [{sku: DWP-KBD-008, title: Mechanical Keyboard 75 percent, quantity: 1}]
  - - {sku: DWP-TEA-001, title: Nilgiri Black Tea 250g, quantity: 1}
    - {sku: DWP-NTB-011, title: Hardcover Notebook A5, quantity: 1}

issuers: &issuers
  - did:web:trusted-surface.dwarpal.test
  - did:web:sandbox-wallet.dwarpal.test
  - did:web:bank.dwarpal.test

scenarios:
  - id: forged-credential-signature
    description: The open Checkout Mandate is signed by a key that is not the issuing authority's.
    tamper:
      forge_issuer_signature: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_SIGNATURE_INVALID
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: algorithm-confusion-alg-none
    description: >
      The issuer JWT header claims alg "none" and carries no signature. A verifier that trusted the
      header over its own policy would skip the check entirely.
    tamper:
      signing_algorithm: none
    expect_blocked: true
    expect_reason_codes:
      - CRED_SIGNATURE_INVALID
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: algorithm-confusion-symmetric
    description: >
      The header claims HS256 over a credential signed for ES256. The classic confusion attack asks
      the verifier to treat a published public key as a shared secret.
    tamper:
      signing_algorithm: HS256
    expect_blocked: true
    expect_reason_codes:
      - CRED_SIGNATURE_INVALID
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: duplicated-disclosure
    description: >
      One disclosure is presented twice. RFC 9901 requires this to be rejected: a verifier that
      resolved the second silently would accept a presentation assembled from parts.
    tamper:
      duplicate_disclosure: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_SIGNATURE_INVALID
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: tampered-disclosure
    description: >
      A disclosure is re-salted, so it is still well-formed JSON but hashes to a digest the issuer
      never committed to. The claim it carries must not reach the policy layer as if it were signed.
    tamper:
      mutate_disclosure: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_SIGNATURE_INVALID
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: replayed-credential
    description: A credential that already completed a purchase is presented a second time.
    setup:
      replay_same_credentials: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_REPLAYED
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: confused-deputy
    description: >
      An agent presents a credential issued to a different agent. The closed mandate is signed by
      a key that is not the one named in the open mandate's cnf claim.
    tamper:
      wrong_agent_key: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_SUBJECT_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: missing-key-binding
    description: The agent presents the mandate without proving possession of the bound key.
    tamper:
      drop_key_binding: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_KEY_BINDING_MISSING
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: key-binding-addressed-to-another-merchant
    description: >
      A genuine proof of possession, addressed to somebody else. Replaying it here would let a
      proof collected by one merchant be spent at another.
    tamper:
      key_binding_audience: https://another-merchant.example
    expect_blocked: true
    expect_reason_codes:
      - CRED_SUBJECT_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: key-binding-answers-the-wrong-challenge
    description: The proof of possession carries a nonce the merchant did not issue for this attempt.
    tamper:
      key_binding_nonce: a-nonce-this-merchant-never-issued
    expect_blocked: true
    expect_reason_codes:
      - CRED_SUBJECT_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: key-binding-proof-is-too-old
    description: >
      The mandate is inside its own validity window but the possession proof is an hour old. The
      credential's window says nothing about when the holder last proved it held the key.
    tamper:
      key_binding_age_seconds: 4000
    expect_blocked: true
    expect_reason_codes:
      - CRED_EXPIRED
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: expired-credential
    description: The mandate expired well outside the configured clock-skew tolerance.
    tamper:
      expired: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_EXPIRED
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: valid-only-under-exaggerated-skew
    description: >
      A credential that would only be valid if the merchant accepted an implausibly large clock
      difference. The tolerance is small and configurable, so this is refused.
    tamper:
      not_yet_valid: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_NOT_YET_VALID
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: unknown-issuing-authority
    description: >
      The mandate names an issuing authority that is not in the trust registry. The declared issuer
      is overridden by the tamper, so this technique varies only by cart.
    tamper:
      unknown_issuer: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_ISSUER_UNKNOWN
    matrix:
      cart: *carts
