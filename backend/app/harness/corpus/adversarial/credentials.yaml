family: credential-integrity
description: >
  Attacks on the credential chain itself: forged signatures, replay, presentation by an agent the
  credential was not issued to, validity windows, and untrusted issuing authorities.

scenarios:
  - id: forged-credential-signature
    description: The open Checkout Mandate is signed by a key that is not the issuing authority's.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    tamper:
      forge_issuer_signature: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_SIGNATURE_INVALID

  - id: replayed-credential
    description: A credential that already completed a purchase is presented a second time.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    setup:
      replay_same_credentials: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_REPLAYED

  - id: confused-deputy
    description: >
      An agent presents a credential issued to a different agent. The closed mandate is signed by
      a key that is not the one named in the open mandate's cnf claim.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    tamper:
      wrong_agent_key: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_SUBJECT_MISMATCH

  - id: missing-key-binding
    description: The agent presents the mandate without proving possession of the bound key.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    tamper:
      drop_key_binding: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_KEY_BINDING_MISSING

  - id: expired-credential
    description: The mandate expired well outside the configured clock-skew tolerance.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    tamper:
      expired: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_EXPIRED

  - id: valid-only-under-exaggerated-skew
    description: >
      A credential that would only be valid if the merchant accepted an implausibly large clock
      difference. The tolerance is small and configurable, so this is refused.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    tamper:
      not_yet_valid: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_NOT_YET_VALID

  - id: unknown-issuing-authority
    description: The mandate names an issuing authority that is not in the trust registry.
    cart:
      - sku: DWP-TEA-001
        title: Nilgiri Black Tea 250g
        quantity: 1
    tamper:
      unknown_issuer: true
    expect_blocked: true
    expect_reason_codes:
      - CRED_ISSUER_UNKNOWN
