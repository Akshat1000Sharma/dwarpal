family: cart-and-binding
description: >
  Attacks on the binding between the merchant's signed Checkout and what the agent presents:
  altered carts, a Checkout signed by somebody else, price and currency drift between quote and
  payment, stale quotes, policy-hash mismatches, and payment redirected to another payee or
  instrument.

  The binding techniques refuse before the policy kernel runs, so they are executed against every
  cart and tier. The two payment-allowlist techniques are decided by the kernel, which checks the
  tier ceiling first, so those run against carts every tier can afford. Otherwise they would be
  refused for the wrong reason and prove nothing.

carts: &carts
  - [{sku: DWP-TEA-001, title: Nilgiri Black Tea 250g, quantity: 1}]
  - [{sku: DWP-NTB-011, title: Hardcover Notebook A5, quantity: 2}]
  - [{sku: DWP-MLK-003, title: Fresh Paneer 400g, quantity: 3}]
  - [{sku: DWP-KBD-008, title: Mechanical Keyboard 75 percent, quantity: 1}]
  - - {sku: DWP-TEA-001, title: Nilgiri Black Tea 250g, quantity: 1}
    - {sku: DWP-NTB-011, title: Hardcover Notebook A5, quantity: 1}

affordable_carts: &affordable_carts
  - [{sku: DWP-TEA-001, title: Nilgiri Black Tea 250g, quantity: 1}]
  - [{sku: DWP-NTB-011, title: Hardcover Notebook A5, quantity: 2}]
  - [{sku: DWP-MLK-003, title: Fresh Paneer 400g, quantity: 3}]
  - - {sku: DWP-TEA-001, title: Nilgiri Black Tea 250g, quantity: 1}
    - {sku: DWP-NTB-011, title: Hardcover Notebook A5, quantity: 1}

issuers: &issuers
  - did:web:trusted-surface.dwarpal.test
  - did:web:sandbox-wallet.dwarpal.test
  - did:web:bank.dwarpal.test

scenarios:
  - id: checkout-hash-does-not-cover-its-jwt
    description: >
      The closed mandate carries a checkout_hash that is not the digest of the checkout_jwt beside
      it, which is what a naive implementation would fail to notice.
    tamper:
      altered_checkout_hash: this-is-not-the-real-digest
    expect_blocked: true
    expect_reason_codes:
      - CHECKOUT_BINDING_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: checkout-signed-by-a-stranger
    description: >
      A Checkout carrying the merchant's own terms, re-signed by a key that is not the merchant's,
      with the hash recomputed so it still covers the token it claims to. Only the signature check
      catches this, which is exactly the point of making it.
    tamper:
      checkout_jwt_from_stranger: true
    expect_blocked: true
    expect_reason_codes:
      - CHECKOUT_BINDING_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: price-altered-between-quote-and-payment
    description: >
      The Payment Mandate authorises one rupee while the merchant-signed Checkout says the real
      total. The merchant must not settle for the smaller figure.
    tamper:
      payment_amount_minor: 100
    expect_blocked: true
    expect_reason_codes:
      - PRICE_DRIFT
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: payment-currency-differs-from-the-checkout
    description: >
      The Payment Mandate authorises the right number in the wrong currency. Comparing the amounts
      and not the units would let a cart priced in paise be settled in cents.
    tamper:
      payment_currency: USD
    expect_blocked: true
    expect_reason_codes:
      - CONSTRAINT_CURRENCY_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: payment-mandate-bound-to-another-checkout
    description: The Payment Mandate names a transaction_id belonging to a different checkout.
    tamper:
      payment_transaction_id: some-other-checkout-digest
    expect_blocked: true
    expect_reason_codes:
      - CHECKOUT_BINDING_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: stale-quote
    description: The agent presents a valid chain against a quote that has already expired.
    setup:
      expire_quote: true
    expect_blocked: true
    expect_reason_codes:
      - CHECKOUT_EXPIRED
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: policy-hash-mismatch
    description: >
      The terms change between the quote and the checkout attempt, so the hash the agent
      acknowledged is no longer the live one.
    setup:
      policy_changes_after_quote: true
    expect_blocked: true
    expect_reason_codes:
      - POLICY_HASH_MISMATCH
    matrix:
      cart: *carts
      mandate.issuer_id: *issuers

  - id: instrument-not-in-the-allowlist
    description: The agent pays with an instrument the human never authorised.
    tamper:
      payment_instrument:
        id: pi_attacker_card
        type: CARD
        description: an instrument the human never approved
    expect_blocked: true
    expect_reason_codes:
      - CONSTRAINT_INSTRUMENT_NOT_ALLOWED
    matrix:
      cart: *affordable_carts
      mandate.issuer_id: *issuers

  - id: payee-substituted
    description: The agent redirects payment to a payee outside the human's allowlist.
    tamper:
      payee:
        id: merchant-controlled-by-the-attacker
        name: Not The Merchant
    expect_blocked: true
    expect_reason_codes:
      - CONSTRAINT_PAYEE_NOT_ALLOWED
    matrix:
      cart: *affordable_carts
      mandate.issuer_id: *issuers

  - id: settled-checkout-presented-again
    description: >
      A Checkout that already settled, presented a second time with freshly signed closed mandates.
      They are not replays, so the credential chain has nothing to object to; the Checkout's own
      state is the only thing standing between one cart and two charges. This is also how a single
      answered escalation would have kept settling: approve once, present again, charge again.
    setup:
      resettle_same_checkout: true
    expect_blocked: true
    expect_reason_codes:
      - CHECKOUT_ALREADY_SETTLED
    matrix:
      # The first attempt has to settle before the second can be refused for re-settling it, so
      # these are carts every tier in the matrix can afford.
      cart: *affordable_carts
      mandate.issuer_id: *issuers
