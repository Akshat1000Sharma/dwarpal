[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The soak suite is deselected by default so the everyday run stays fast. A command line -m is
# parsed after addopts and wins, so "pytest -m soak" runs exactly those tests.
addopts = "-q --strict-markers -m 'not soak'"
markers = [
    "concurrency: tests that require real committed transactions and row locking",
    "soak: long-running tests, sized by SOAK_SCALE (full locally, ci in CI)",
]
filterwarnings = ["ignore::DeprecationWarning"]
