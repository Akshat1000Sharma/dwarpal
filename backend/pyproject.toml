[project]
name = "dwarpal-backend"
version = "1.0.0"
description = "AP2 merchant endpoint for Razorpay"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "concurrency: tests that require real committed transactions and row locking",
]
filterwarnings = ["ignore::DeprecationWarning"]
